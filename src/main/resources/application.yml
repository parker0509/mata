spring:
  datasource:
    url: jdbc:mysql://localhost:3308/chat_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: qwer1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect  # MySQL 8 Dialect ??
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  profiles:
    active: dev

  redis:
    host: localhost
    port: 6379
    timeout: 60000 # Redis ???? ??

  websocket:
    enabled: true

  iamport:
    api:
      key: ${IAMPORT_API_KEY}
      secret: ${IAMPORT_API_SECRET} # IAMPORT API Key? Secret
